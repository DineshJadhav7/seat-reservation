spring.application.name=seat-reservation
spring.main.banner-mode=off
server.port=${PORT:8000}

# JDK 21 virtual threads: a request waiting for a DB connection doesn't hog a platform thread,
# so /healthz and /readyz stay responsive during a burst.
spring.threads.virtual.enabled=true

# JSON in/out uses snake_case (price_paise, idempotency_key ...) while the Java code stays camelCase
spring.jackson.property-naming-strategy=SNAKE_CASE

# We create the tables ourselves (SchemaInitializer, with retries). Without this, Spring Boot would try to
# open a DB connection at start-up just to decide whether to run schema.sql, and stall if the DB is still waking up.
spring.sql.init.mode=never

app.admin-token=${ADMIN_TOKEN:admin-secret}
app.per-user-limit=${PER_USER_LIMIT:4}
app.db.pool-max=${DB_POOL_MAX:20}

# Prometheus metrics are served by Spring Boot Actuator, mapped to /metrics at the root path
management.endpoints.web.base-path=/
management.endpoints.web.discovery.enabled=false
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics
