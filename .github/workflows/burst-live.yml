name: burst-live

# Run the on-sale stampede against a deployed service from GitHub's servers (no laptop needed):
# Actions tab -> burst-live -> Run workflow -> paste the live URL and the service's ADMIN_TOKEN.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Live URL, for example https://seat-reservation-xxxx.onrender.com"
        required: true
      admin_token:
        description: "ADMIN_TOKEN of the deployed service"
        required: true
      requests:
        description: "Number of stampede requests"
        required: true
        default: "20000"

permissions:
  contents: read

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: ${{ inputs.base_url }}
      ADMIN_TOKEN: ${{ inputs.admin_token }}
      REQUESTS: ${{ inputs.requests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Wake the service up (the free tier sleeps when idle)
        shell: bash
        run: |
          echo "::add-mask::$ADMIN_TOKEN"
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -f "$BASE_URL/readyz"; then
              echo "ready after $i attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "the service did not become ready within 5 minutes"
          exit 1

      - name: Stampede
        shell: bash
        run: java scripts/Burst.java "$BASE_URL" --admin-token "$ADMIN_TOKEN" --requests "$REQUESTS" | tee burst.txt

      - name: Put the results on the run summary page
        if: always()
        shell: bash
        run: |
          {
            echo "### Live stampede results for $BASE_URL"
            echo '```'
            cat burst.txt 2>/dev/null || echo "(no burst output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
