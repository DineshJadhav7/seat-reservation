name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-stampede:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Start the service, run the 20,000-request stampede, check fail-closed readiness
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seats
          ADMIN_TOKEN: ci-admin-token
          REQUESTS: "20000"
        run: bash scripts/verify.sh

      - name: Put the results on the run summary page
        if: always()
        shell: bash
        run: |
          {
            echo "### Stampede results"
            echo '```'
            cat burst.txt 2>/dev/null || echo "(no burst output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burst-and-app-logs
          path: |
            burst.txt
            app.log
            app-nodb.log
          if-no-files-found: ignore

  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image exactly as Render will
        run: docker build -t seat-reservation .
